name: flight-delay-monitor

services:

  # ---------------------------------------------------------------
  # Kafka (KRaft mode - no ZooKeeper needed). Official Apache image,
  # multi-arch, runs natively on Apple Silicon.
  # ---------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.1
    container_name: flight-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,PLAINTEXT_HOST://0.0.0.0:9092
      # Other containers reach Kafka as "kafka:19092"; your Mac reaches it as "localhost:9092"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "flight-delay-monitor-cluster"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [flight-net]

  # ---------------------------------------------------------------
  # PostgreSQL - single source of truth for both the app data
  # (flight_monitoring) and the Airflow metadata database (airflow).
  # ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: flight-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flightapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-flight_monitoring}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init-airflow-db.sh:/docker-entrypoint-initdb.d/00-init-airflow-db.sh
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flightapp} -d ${POSTGRES_DB:-flight_monitoring}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [flight-net]

  # ---------------------------------------------------------------
  # Grafana - reads directly from PostgreSQL. Dashboard is
  # provisioned automatically on startup.
  # ---------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: flight-grafana
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change_me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-flight_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-flightapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    networks: [flight-net]

  # ---------------------------------------------------------------
  # Airflow - orchestration only (health checks + maintenance).
  # Runs as a single "standalone" container (webserver + scheduler),
  # which avoids the native macOS scheduler/multiprocessing issues.
  # Uses the SAME Postgres instance, in a separate "airflow" database.
  # ---------------------------------------------------------------
  airflow:
    image: apache/airflow:2.10.2-python3.11
    container_name: flight-airflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-flightapp}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-change_me}
      _PIP_ADDITIONAL_REQUIREMENTS: "psycopg2-binary==2.9.9"
      # Values the DAGs use to reach Kafka/Postgres from *inside* the Docker network
      FLIGHT_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      FLIGHT_POSTGRES_HOST: postgres
      FLIGHT_POSTGRES_PORT: 5432
      FLIGHT_POSTGRES_DB: ${POSTGRES_DB:-flight_monitoring}
      FLIGHT_POSTGRES_USER: ${POSTGRES_USER:-flightapp}
      FLIGHT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_data:/opt/airflow
    command: standalone
    networks: [flight-net]

networks:
  flight-net:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
  airflow_data:
